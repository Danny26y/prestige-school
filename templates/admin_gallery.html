<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Manager - Prestige School Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <style>
        .gallery-preview-img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }
        .gallery-item {
            background: white;
            padding: 0.5rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            position: relative;
        }
        .delete-btn {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background: rgba(220, 38, 38, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .delete-btn:hover {
            background: rgba(185, 28, 28, 1);
        }
    </style>
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="{{ url_for('static', path='/img/logo.svg') }}" alt="Logo" width="32" height="32" style="filter: brightness(0) invert(1);">
                <h2>Admin Portal</h2>
            </div>
            <ul class="nav-links">
                <li><a href="/admin" class="nav-link">Applications</a></li>
                <li><a href="/admin/news" class="nav-link">News Editor</a></li>
                <li><a href="/admin/gallery" class="nav-link active">Gallery Manager</a></li>
                <li><a href="/logout" class="nav-link">Logout</a></li>
            </ul>
        </aside>

        <main class="dashboard-content">
            <header class="mb-6">
                <h1>Gallery Manager</h1>
                <p style="color: var(--text-light);">Upload and manage campus photos shown on the homepage.</p>
            </header>

            <div class="card">
                <form id="galleryForm" enctype="multipart/form-data">
                    <div style="display: grid; gap: 1rem; margin-bottom: 1rem;">
                        <div>
                            <label style="display:block; margin-bottom: 0.5rem; font-weight: 600;">Upload Photo (Max 2MB)</label>
                            <input type="file" name="image" id="image" accept="image/jpeg,image/png,image/webp" required style="width:100%; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 4px;">
                        </div>
                        <div>
                            <label style="display:block; margin-bottom: 0.5rem; font-weight: 600;">Caption (Optional)</label>
                            <input type="text" name="caption" id="caption" placeholder="e.g., Main Admin Block" style="width:100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 4px;">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary" id="submitBtn">Upload to Gallery</button>
                </form>
            </div>

            <div class="gallery-grid">
                {% for img in gallery_images %}
                <div class="gallery-item">
                    <img src="{{ img.imageUrl }}" alt="Gallery Image" class="gallery-preview-img">
                    <p style="margin: 0.5rem 0; font-size: 0.85rem; color: var(--text-light); text-align: center;">{{ img.caption or 'No caption' }}</p>
                    <form action="/admin/gallery/delete/{{ img.id }}" method="POST" onsubmit="return confirm('Delete this image?');">
                        <button type="submit" class="delete-btn" title="Delete">
                            <iconify-icon icon="mdi:delete"></iconify-icon>
                        </button>
                    </form>
                </div>
                {% else %}
                <div style="grid-column: 1/-1; text-align: center; padding: 3rem;">
                    <p style="color: var(--text-light);">No images in the gallery yet.</p>
                </div>
                {% endfor %}
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', path='/js/app.js') }}"></script>
    <script>
        document.getElementById('galleryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = 'Uploading...';
            btn.disabled = true;

            const formData = new FormData(e.target);
            try {
                const res = await fetch('/admin/gallery/add', {
                    method: 'POST',
                    body: formData
                });

                if (res.ok) {
                    window.location.reload();
                } else {
                    const error = await res.json();
                    alert(error.detail || 'Upload failed');
                }
            } catch (err) {
                alert('Network error during upload');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
